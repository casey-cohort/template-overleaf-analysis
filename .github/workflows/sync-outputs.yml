name: Sync outputs to manuscript repo

on:
  push:
    branches: [main]
    paths:
      - 'figures/**'
      - 'tex/**'
      - '.github/workflows/sync-outputs.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ variables.MANUSCRIPT_REPO }}
          token:: ${{ secrets.MANUSCRIPT_PAT }}
          path: target

      - name: Replace tables_figures contents
        run: |
          rm -rf target/tables_figures_sync/
          mkdir -p target/tables_figures_sync/
          cp -R source/tables_figures/ target/tables_figures_sync/


      - name: Replace tex values
        run: |
          rm -rf target/tex_sync
          cp source/tex/ target/tex_sync

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tables_figures
          git add tex
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync figures from wfbz_viz@${GITHUB_SHA::7}"
            git push
          fi
